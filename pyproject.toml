[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slotrag"
version = "0.1.0"
description = "Cost-aware query-specific evidence materialization for multi-hop RAG"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "rank-bm25>=0.2,<1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-httpx>=0.30,<1"]

[project.scripts]
slotrag = "slotrag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: calls configured external model services",
]
