agnes:
  base_url: http://10.200.37.71:8801/v1
  model: qwen3.6-27b
  api_key_env: SLOTRAG_AGNES_API_KEY
  timeout_seconds: 60
  max_retries: 3
  retry_backoff_seconds: 0.5
  max_tokens: 4096
  temperature: 0.0

embedding:
  base_url: http://0.0.0.0:30000/v1
  model: Qwen/Qwen3-Embedding-0.6B
  api_key_env: SLOTRAG_EMBEDDING_API_KEY
  timeout_seconds: 60
  max_retries: 2
  retry_backoff_seconds: 0.25
  dimension: 1024
  batch_size: 32

reranker:
  base_url: http://10.200.37.71:8801/v1
  model: bge-reranker-v2-m3
  api_key_env: SLOTRAG_RERANKER_API_KEY
  timeout_seconds: 60
  max_retries: 2
  retry_backoff_seconds: 0.25
  enabled: true
  top_n: 10

retrieval:
  bm25_k: 50
  dense_k: 50
  final_k: 10
  rrf_k: 60
  bm25_weight: 0.5
  dense_weight: 0.5
  chunk_tokens: 384
  chunk_overlap: 64

execution:
  max_replans: 16
  default_slot_cost: 1.0
  unbound_argument_cost: 2.0
  random_seed: 2027
  materialization_top_k: 5
  max_binding_contexts: 2
  max_retrieval_calls: 4

data:
  cache_dir: data/raw
  processed_dir: data/processed

rate_limit:
  provider_rpm: 600
  operational_rpm: 400
  max_concurrency: 32
  # Model (qwen3.5-9b) is fast: user benchmark proved 128-concurrent 0% failure
  # at 3246 tok/s. The old 30/20/4 caps were the real throughput bottleneck (the
  # FileRateLimiter used operational_rpm=20 -> 1 call/3s, plus concurrency=4),
  # NOT the model. Raised to a safe fraction of proven capacity.
  # NOTE: .env sets SLOTRAG_PROVIDER_RPM=200, which overrides provider_rpm below.
  # Per-service provider ceilings MUST be set explicitly and stay >= their
  # operational_rpm, or validate_operational_limit() aborts startup with
  # "X_operational_rpm cannot exceed X_provider_rpm" — the run dies before
  # executing a single question (this is what caused the relaunch death-loop).
  agnes_provider_rpm: 3000
  agnes_operational_rpm: 400
  agnes_max_concurrency: 32
  reranker_provider_rpm: 3000
  reranker_operational_rpm: 200
  reranker_max_concurrency: 16
  embedding_operational_rpm: 400
  embedding_max_concurrency: 32
  # NVMe state dir: the per-API-call .slot writes were hitting the /data HDD
  # jbd2 journal, which stalls behind another job's heavy writeback and wedges
  # every benchmark call in jbd2_log_wait_commit / folio_wait_bit_common.
  state_dir: /tmp/tkde_runs/.rate-limits
