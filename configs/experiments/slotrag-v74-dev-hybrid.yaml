benchmark_root: benchmark
output_root: runs
datasets:
  - hotpotqa
  - 2wikimultihop
seed: 314159
random_seeds: [314159]
budget:
  max_steps: 8
  max_llm_calls: 48
  max_retrieval_calls: 16
  question_timeout_seconds: 600
stages:
  qo_v74_development_hybrid:
    split: train
    sample_size: 40
    methods:
      - slotrag
      - slotrag-dual-access
      - slotrag-evidence-bundle
      - slotrag-per-path-extraction
    retrieval_protocol: global_corpus
    retrieval_backend: hybrid
    shared_index_dir: runs/slotrag-global-index-v74-hybrid
    max_corpus_build_minutes: 1
