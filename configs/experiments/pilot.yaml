benchmark_root: benchmark
output_root: runs
datasets:
  - hotpotqa
  - 2wikimultihop
  - musique
  - strategyqa
  - drop
seed: 2027
random_seeds: [2027, 2028, 2029, 2030, 2031]
budget:
  max_steps: 4
  max_llm_calls: 64
  max_retrieval_calls: 4
  question_timeout_seconds: 300
stages:
  preflight:
    split: train
    sample_size: 1
    methods: [slotrag, hybrid]
  main_gate:
    split: train
    sample_size: 1
    methods: [slotrag, hybrid, ircot, react, planrag, srag, graphrag]
  ablation_gate:
    split: train
    sample_size: 1
    methods:
      - slotrag
      - slotrag-question
      - slotrag-fixed
      - slotrag-random
      - slotrag-oracle
      - slotrag-no-replan
      - slotrag-late-join
      - slotrag-eager
      - slotrag-no-bindings
      - slotrag-no-operators
      - slotrag-no-direct
      - slotrag-no-extremum-template
      - slotrag-no-polar-template
      - slotrag-no-polar-consensus
      - slotrag-typed-extraction
      - slotrag-anchor-folding
      - slotrag-anchor-substitution
      - slotrag-role-projected-substitution
      - slotrag-grounded-role-projection
  smoke:
    split: train
    sample_size: 2
    methods:
      - slotrag
      - hybrid
      - ircot
      - react
      - planrag
      - srag
      - graphrag
      - slotrag-question
      - slotrag-fixed
      - slotrag-random
      - slotrag-oracle
      - slotrag-no-replan
      - slotrag-late-join
      - slotrag-eager
      - slotrag-no-bindings
      - slotrag-no-operators
      - slotrag-no-direct
      - slotrag-no-extremum-template
      - slotrag-no-polar-template
      - slotrag-no-polar-consensus
      - slotrag-typed-extraction
      - slotrag-anchor-folding
      - slotrag-anchor-substitution
      - slotrag-role-projected-substitution
      - slotrag-grounded-role-projection
  diagnostic:
    split: train
    sample_size: 10
    methods: [slotrag, hybrid]
  polar_contract_gate:
    split: train
    sample_size: 10
    methods: [slotrag-typed-extraction, hybrid, slotrag]
  frozen_polar_contract_gate:
    split: train
    sample_size: 10
    methods: [slotrag, slotrag-typed-extraction, hybrid]
    frozen_plan_source: slotrag
  entity_anchor_gate:
    split: train
    sample_size: 10
    methods: [slotrag, slotrag-anchor-folding, hybrid]
    frozen_plan_source: slotrag
    frozen_plan_import_dir: runs/vldb2027-diagnostic-v13/plans/frozen_polar_contract_gate
  entity_anchor_substitution_gate:
    split: train
    sample_size: 10
    methods: [slotrag, slotrag-anchor-folding, slotrag-anchor-substitution, hybrid]
    frozen_plan_source: slotrag
    frozen_plan_import_dir: runs/vldb2027-diagnostic-v13/plans/frozen_polar_contract_gate
  entity_anchor_role_gate:
    split: train
    sample_size: 10
    methods: [slotrag, slotrag-anchor-folding, slotrag-anchor-substitution, slotrag-role-projected-substitution, hybrid]
    frozen_plan_source: slotrag
    frozen_plan_import_dir: runs/vldb2027-diagnostic-v13/plans/frozen_polar_contract_gate
  entity_anchor_role_telemetry_gate:
    split: train
    sample_size: 10
    methods: [slotrag, slotrag-anchor-substitution, slotrag-role-projected-substitution]
    frozen_plan_source: slotrag
    frozen_plan_import_dir: runs/vldb2027-diagnostic-v13/plans/frozen_polar_contract_gate
  entity_anchor_role_tune:
    split: train
    sample_size: 50
    methods: [slotrag, slotrag-anchor-substitution, slotrag-role-projected-substitution]
    frozen_plan_source: slotrag
  grounded_role_projection_gate:
    split: train
    sample_size: 50
    methods: [slotrag, slotrag-anchor-substitution, slotrag-grounded-role-projection]
    frozen_plan_source: slotrag
    frozen_plan_import_dir: runs/vldb2027-diagnostic-v18/plans/entity_anchor_role_tune
  tune:
    split: train
    sample_size: 50
    methods: [slotrag, hybrid, ircot, react, planrag, srag, graphrag]
  ablations:
    split: train
    sample_size: 50
    methods:
      - slotrag
      - slotrag-question
      - slotrag-fixed
      - slotrag-random
      - slotrag-oracle
      - slotrag-no-replan
      - slotrag-late-join
      - slotrag-eager
      - slotrag-no-bindings
      - slotrag-no-operators
      - slotrag-no-direct
      - slotrag-no-extremum-template
      - slotrag-no-polar-template
      - slotrag-no-polar-consensus
      - slotrag-typed-extraction
      - slotrag-anchor-folding
      - slotrag-anchor-substitution
      - slotrag-role-projected-substitution
      - slotrag-grounded-role-projection
  validation:
    split: train
    sample_size: 200
    methods: [slotrag, hybrid, ircot, react, planrag, srag, graphrag]
  final:
    split: evaluation
    sample_size: 500
    methods: [slotrag, hybrid, ircot, react, planrag, srag, graphrag]
