benchmark_root: benchmark
output_root: runs
datasets:
  - hotpotqa
  - 2wikimultihop
  - musique
  - strategyqa
  - drop
seed: 7123
random_seeds: [7123, 7124, 7125, 7126, 7127]
budget:
  max_steps: 6
  max_llm_calls: 64
  max_retrieval_calls: 6
  question_timeout_seconds: 300
stages:
  method_tune:
    split: train
    sample_size: 10
    methods:
      - slotrag
      - slotrag-dual-query-retrieval
      - slotrag-adaptive-dual-query-retrieval
      - slotrag-grounded-dual-query-retrieval
      - slotrag-grounded-adaptive-dual-query-retrieval
