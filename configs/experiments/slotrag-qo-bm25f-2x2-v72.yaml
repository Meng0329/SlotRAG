benchmark_root: benchmark
output_root: runs
datasets:
  - hotpotqa
  - 2wikimultihop
seed: 314159
random_seeds: [314159]
budget:
  max_steps: 8
  max_llm_calls: 48
  max_retrieval_calls: 8
  question_timeout_seconds: 600
stages:
  qo_bm25f_global_dev_v72_smoke:
    split: train
    sample_size: 4
    methods:
      - slotrag
      - slotrag-sufficiency
      - slotrag-physical-policy
      - slotrag-qo
    retrieval_protocol: global_corpus
    retrieval_backend: bm25
    shared_index_dir: runs/slotrag-global-index-v72-bm25f/runner-registry
    sufficiency_calibrator_path: runs/slotrag-qo-development-validation-v66-valid/analysis/qo_trace_global_dev_v66_backend_features_complete/sufficiency-calibrator-v65-frozen.json
    frozen_plan_source: slotrag
    frozen_plan_import_dir: runs/slotrag-qo-2x2-global-smoke-v67/plans/qo_trace_global_dev_v66_validation
  qo_bm25f_local_dev_v72_smoke:
    split: train
    sample_size: 4
    methods:
      - slotrag
      - slotrag-sufficiency
      - slotrag-physical-policy
      - slotrag-qo
    retrieval_protocol: local_context
    retrieval_backend: bm25
    sufficiency_calibrator_path: runs/slotrag-qo-development-validation-v66-valid/analysis/qo_trace_global_dev_v66_backend_features_complete/sufficiency-calibrator-v65-frozen.json
    frozen_plan_source: slotrag
    frozen_plan_import_dir: runs/slotrag-qo-2x2-global-smoke-v67/plans/qo_trace_global_dev_v66_validation
