    sample_size: 10
    methods:
      - slotrag
      - slotrag-confidence-gated-dual-query-0p5
      - slotrag-confidence-gated-dual-query-0p75
      - slotrag-grounded-adaptive-confidence-gated-dual-query-0p5
      - slotrag-grounded-adaptive-confidence-gated-dual-query-0p75
